<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Expense Tracker</h1>
            <p>Track your income and expenses</p>
        </header>

        <!-- Balance -->
        <section class="balance-box">
            <h2>Total Balance</h2>
            <h3 id="balance">₹0</h3>
        </section>

        <!-- Income & Expense -->
        <section class="summary">
            <div class="summary-box income">
                <h3>Income</h3>
                <p id="income">₹0</p>
            </div>

            <div class="summary-box expense">
                <h3>Expenses</h3>
                <p id="expense">₹0</p>
            </div>
        </section>

        <!-- Add Transaction -->
        <section class="form-section">
            <h2>Add Transaction</h2>

            <form id="transaction-form">

                <div class="input-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g. Grocery">
                </div>

                <div class="input-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="e.g. 500">
                </div>

                <div class="input-group">
                    <label for="type">Type</label>

                    <select id="type">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>

                <button type="submit" id="submit">Add Transaction</button>

            </form>
        </section>

        <!-- Transactions -->
        <section class="transactions">

            <h2>Transaction History</h2>



            
            <table>
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Type</th>
                    </tr>
                </thead>
                <tbody id="new-list">
                        <!-- JavaScript will add transactions here -->
                </tbody>

            </table>



        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
